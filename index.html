<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Page Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.tagline { color: #666; margin-top: 0; }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #1a1a1a;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { min-height: 20px; margin-bottom: 12px; font-size: 0.9rem; }
  #status.error { color: #b00020; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
  th { width: 40%; color: #555; font-weight: 500; }
  footer { margin-top: 60px; font-size: 0.8rem; color: #888; text-align: center; }
  footer a { color: #888; }
</style>
</head>
<body>
  <h1>Page Pulse</h1>
  <p class="tagline">Paste a URL, get a quick health report.</p>

  <form id="audit-form">
    <input type="text" id="url-input" placeholder="https://example.com" required />
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="status"></div>
  <table id="report" hidden></table>

  <footer>
    Built for Digital Heroes Training Task &middot;
    <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
  </footer>

<script>
  const form = document.getElementById('audit-form');
  const input = document.getElementById('url-input');
  const status = document.getElementById('status');
  const table = document.getElementById('report');
  const submitBtn = document.getElementById('submit-btn');

  function renderReport(data) {
    const rows = [
      ['URL', data.url],
      ['HTTP Status', data.httpStatus],
      ['Response Time', `${data.responseTimeMs} ms`],
      ['Title', data.title || '(none found)'],
      ['Meta Description', data.metaDescription || '(none found)'],
      ['H1 Count', data.h1Count],
      ['Images (total / missing alt)', `${data.images.total} / ${data.images.missingAlt}`],
      ['Approx. Word Count', data.approxWordCount],
    ];
    table.innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('');
    table.hidden = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = '';
    status.textContent = 'Fetching...';
    table.hidden = true;
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/audit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: input.value.trim() }),
      });
      const data = await res.json();

      if (!res.ok) {
        status.className = 'error';
        status.textContent = data.message || 'Something went wrong.';
        return;
      }

      status.textContent = '';
      renderReport(data);
    } catch (err) {
      status.className = 'error';
      status.textContent = 'Network error — could not reach the server.';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
